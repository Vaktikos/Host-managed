openapi: 3.1.0
info:
  title: Host-managed API
  version: "1"
  description: |
    REST API of the Host-managed control plane.

    Authentication: either `Authorization: Bearer hm_<id>_<secret>` (API token)
    or the `hm_session` cookie from `POST /auth/login`. Cookie-authenticated
    write requests must send the `X-CSRF-Token` header returned by login and
    `GET /auth/me`.

    Errors always have the form `{"error": {"code", "message", "field", "request_id"}}`.
    Long-running operations return `202 Accepted` with a job; poll
    `GET /jobs/{id}` and `GET /jobs/{id}/log`.
servers:
  - url: /api/v1
security:
  - token: []
  - session: []
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
    session:
      type: apiKey
      in: cookie
      name: hm_session
  parameters:
    name:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,62}$' }
    ctname:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
    pool:
      name: pool
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Accepted:
      description: Job started
      headers:
        Location: { schema: { type: string } }
      content:
        application/json:
          schema:
            type: object
            properties:
              job: { $ref: '#/components/schemas/Job' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                Machine-readable code, e.g. validation, unauthenticated, forbidden, csrf,
                not_found, conflict, locked, rate_limited, agent_unavailable, internal,
                last_admin, self_delete, too_large, length_required, invalid_mfa, mfa_expired
            message: { type: string }
            field: { type: string, description: Offending input field for validation errors }
            request_id: { type: string }
    Me:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        permissions: { type: array, items: { type: string } }
        csrf_token: { type: string }
        product: { type: string }
        version: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string, enum: [admin, vm-admin, operator, storage-admin, network-admin, backup-admin, auditor] }
        language: { type: string, enum: [de, en] }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        password_changed_at: { type: string, format: date-time }
        mfa_enabled: { type: boolean }
    Job:
      type: object
      properties:
        id: { type: string }
        type: { type: string, example: vm.create }
        target: { type: string, example: vm/web1 }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        username: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        error: { type: string }
        progress: { type: [number, 'null'], description: 'Measured progress in percent; null when not measurable' }
    VMStats:
      type: object
      description: Rates are null until two samples exist.
      properties:
        state: { type: string }
        cpu_usage: { type: [number, 'null'] }
        memory_mib: { type: integer }
        memory_used_kib: { type: [integer, 'null'] }
        net_rx_bps: { type: [number, 'null'] }
        net_tx_bps: { type: [number, 'null'] }
        disk_read_bps: { type: [number, 'null'] }
        disk_write_bps: { type: [number, 'null'] }
        time: { type: string, format: date-time }
    VM:
      type: object
      properties:
        uuid: { type: string }
        name: { type: string }
        state: { type: string, enum: [running, blocked, paused, shutting-down, shutoff, crashed, suspended, unknown] }
        vcpus: { type: integer }
        memory_mib: { type: integer }
        autostart: { type: boolean }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        template: { type: boolean }
        stats: { $ref: '#/components/schemas/VMStats' }
    VMDetail:
      allOf:
        - $ref: '#/components/schemas/VM'
        - type: object
          properties:
            notes: { type: string }
            domain_type: { type: string, enum: [kvm, qemu] }
            machine: { type: string }
            firmware: { type: string, enum: [bios, uefi] }
            secure_boot: { type: boolean }
            tpm: { type: boolean }
            cpu_mode: { type: string }
            disks:
              type: array
              items:
                type: object
                properties:
                  target: { type: string }
                  device: { type: string, enum: [disk, cdrom] }
                  bus: { type: string }
                  source: { type: string }
                  format: { type: string }
                  capacity: { type: integer }
                  readonly: { type: boolean }
            nics:
              type: array
              items:
                type: object
                properties:
                  mac: { type: string }
                  model: { type: string }
                  type: { type: string, enum: [network, bridge] }
                  source: { type: string }
                  target: { type: string }
            boot_order: { type: [array, 'null'], items: { type: string } }
            console: { type: object, properties: { vnc: { type: boolean } } }
            guest_agent_channel: { type: boolean }
    VMCreate:
      type: object
      required: [name, vcpus, memory_mib, disk_pool, disk_size_gib, network]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string, maxLength: 4096 }
        tags: { type: array, maxItems: 16, items: { type: string } }
        vcpus: { type: integer, minimum: 1, maximum: 512 }
        memory_mib: { type: integer, minimum: 64 }
        cpu_mode: { type: string, enum: [host-passthrough, host-model, qemu64, max], default: host-passthrough }
        firmware: { type: string, enum: [bios, uefi], default: bios }
        secure_boot: { type: boolean, description: requires uefi and KVM }
        tpm: { type: boolean }
        disk_pool: { type: string }
        disk_size_gib: { type: integer, minimum: 1, maximum: 65536 }
        disk_bus: { type: string, enum: [virtio, sata, scsi], default: virtio }
        iso_pool: { type: string }
        iso_volume: { type: string }
        network: { type: string, example: 'network:default', description: 'network:<libvirt network> or bridge:<host bridge>' }
        nic_model: { type: string, enum: [virtio, e1000, rtl8139], default: virtio }
        guest_agent: { type: boolean }
        autostart: { type: boolean }
        start: { type: boolean }
        image_pool: { type: string, description: 'Import this disk image (e.g. a cloud image) instead of creating an empty disk' }
        image_volume: { type: string }
        cloud_init: { $ref: '#/components/schemas/CloudInit' }
    CloudInit:
      type: object
      description: NoCloud seed. Requires ssh_keys or a password. The password is stored only as SHA-512 crypt hash; reads return password_hash "set".
      properties:
        user: { type: string }
        password: { type: string, writeOnly: true }
        password_hash: { type: string, description: '"set" keeps the stored hash on update' }
        ssh_keys: { type: array, items: { type: string } }
        hostname: { type: string }
        ipv4: { type: string, description: 'CIDR; empty = DHCP' }
        gateway4: { type: string }
        ipv6: { type: string, description: 'CIDR, "auto" (SLAAC) or empty (off)' }
        gateway6: { type: string }
        dns: { type: array, items: { type: string } }
        packages: { type: array, items: { type: string } }
        guest_agent: { type: boolean }
    ChangeResult:
      type: object
      properties:
        pending_restart: { type: boolean, description: 'true: written to the configuration only, applies at the next start' }
        target: { type: string }
    Snapshot:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        created_at: { type: integer, description: unix seconds }
        state: { type: string }
        memory: { type: boolean }
        parent: { type: string }
        current: { type: boolean }
    Keep:
      type: object
      description: Retention with Proxmox Backup Server semantics; 0 disables a selector, all 0 keeps everything. Protected backups are never pruned.
      properties:
        keep_last: { type: integer }
        keep_hourly: { type: integer }
        keep_daily: { type: integer }
        keep_weekly: { type: integer }
        keep_monthly: { type: integer }
        keep_yearly: { type: integer }
    Backup:
      type: object
      properties:
        id: { type: string, example: vm/web1/2026-10-16T01-37-36Z }
        store: { type: string }
        kind: { type: string, enum: [vm, ct] }
        name: { type: string }
        created: { type: string, format: date-time }
        host: { type: string }
        software: { type: string }
        mode: { type: string, enum: [snapshot, offline, stop, suspend, live] }
        consistency: { type: string, enum: [application, crash, offline, none] }
        disks: { type: array, items: { type: object, properties: { target: { type: string }, bus: { type: string }, file: { type: string }, format: { type: string }, capacity: { type: integer } } } }
        size: { type: integer }
        notes: { type: string }
        protected: { type: boolean }
        duration_seconds: { type: number }
    BackupSchedule:
      type: object
      required: [name, store, days, at, selection]
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string }
        enabled: { type: boolean }
        store: { type: string }
        days: { type: integer, minimum: 1, maximum: 127, description: 'Weekday bit mask, bit 0 = Sunday' }
        at: { type: string, example: '02:30', description: HH:MM in the server time zone }
        selection: { type: string, enum: [all, vms, containers, list] }
        targets: { type: array, items: { type: string, example: vm/web1 } }
        mode: { type: string, enum: ['', stop, suspend, live], description: container backup mode }
        keep: { $ref: '#/components/schemas/Keep' }
        notes: { type: string }
        last_run: { type: [string, 'null'], format: date-time, readOnly: true }
        last_job: { type: string, readOnly: true }
        next_run: { type: [string, 'null'], format: date-time, readOnly: true }
        running: { type: boolean, readOnly: true }
    Container:
      type: object
      properties:
        name: { type: string }
        state: { type: string }
        autostart: { type: boolean }
        unprivileged: { type: boolean }
        pid: { type: integer }
        ips: { type: array, items: { type: string } }
        memory_limit: { type: integer, description: bytes; 0 = unlimited }
        cpu_limit: { type: number, description: cores; 0 = unlimited }
        memory_usage: { type: integer }
        hostname: { type: string }
        distribution: { type: string }
        release: { type: string }
        description: { type: string }
    ContainerCreate:
      type: object
      required: [name, distribution, release, bridge]
      additionalProperties: false
      properties:
        name: { type: string }
        distribution: { type: string, example: debian }
        release: { type: string, example: trixie }
        arch: { type: string, enum: [amd64, arm64, i386], default: amd64 }
        memory_mib: { type: integer, description: 0 = unlimited }
        swap_mib: { type: integer }
        cpu_limit: { type: number }
        bridge: { type: string, example: virbr0 }
        ipv4: { type: string, description: 'CIDR; empty = DHCP' }
        gateway4: { type: string }
        autostart: { type: boolean }
        start: { type: boolean }
        description: { type: string }
    StoragePool:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        state: { type: string }
        active: { type: boolean }
        autostart: { type: boolean }
        path: { type: string }
        capacity: { type: integer }
        allocation: { type: integer }
        available: { type: integer }
        content: { type: string, enum: [images, iso, backup], description: 'From the pool name: "iso"/"*-iso", "backup"/"*-backup", otherwise images' }
    StorageVolume:
      type: object
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string }
        format: { type: string }
        capacity: { type: integer }
        allocation: { type: integer }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        time: { type: string, format: date-time }
        username: { type: string }
        ip: { type: string }
        action: { type: string }
        resource: { type: string }
        result: { type: string }
        correlation_id: { type: string }
        detail: { type: string }

paths:
  /info:
    get:
      summary: Product name and default language (public)
      security: []
      responses: { '200': { description: OK } }
  /health:
    get:
      summary: Health check (public)
      security: []
      responses: { '200': { description: OK }, '503': { $ref: '#/components/responses/Error' } }
  /auth/login:
    post:
      summary: Sign in; sets the session cookie
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { username: { type: string }, password: { type: string } } }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
      description: 'With MFA enabled the response is {"mfa_required": true, "mfa_token": "…"} and no session is created; continue with /auth/login/mfa.'
  /auth/login/mfa:
    post:
      summary: Second login step with a TOTP or recovery code (5 minutes, 5 attempts)
      security: []
      requestBody: { content: { application/json: { schema: { type: object, properties: { mfa_token: { type: string }, code: { type: string } } } } } }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/me/mfa/setup:
    post:
      summary: Start TOTP enrolment (requires the current password)
      requestBody: { content: { application/json: { schema: { type: object, properties: { password: { type: string } } } } } }
      responses: { '200': { description: '{secret, uri} for the authenticator app' } }
  /auth/me/mfa/enable:
    post:
      summary: Confirm enrolment with a code; returns 10 single-use recovery codes once
      requestBody: { content: { application/json: { schema: { type: object, properties: { code: { type: string } } } } } }
      responses: { '200': { description: '{recovery_codes}' }, '400': { $ref: '#/components/responses/Error' } }
  /auth/me/mfa/disable:
    post:
      summary: Disable TOTP (password and current code required)
      requestBody: { content: { application/json: { schema: { type: object, properties: { password: { type: string }, code: { type: string } } } } } }
      responses: { '204': { description: Disabled } }
  /auth/logout:
    post: { summary: Sign out, responses: { '204': { description: Signed out } } }
  /auth/me:
    get:
      summary: Current user, permissions and CSRF token
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } } }
  /auth/me/password:
    put:
      summary: Change own password (signs out other sessions)
      requestBody:
        content: { application/json: { schema: { type: object, properties: { current_password: { type: string }, new_password: { type: string, minLength: 12 } } } } }
      responses: { '204': { description: Changed }, '400': { $ref: '#/components/responses/Error' } }
  /auth/me/language:
    put:
      summary: Set UI language
      requestBody: { content: { application/json: { schema: { type: object, properties: { language: { type: string, enum: [de, en] } } } } } }
      responses: { '204': { description: Saved } }
  /auth/me/sessions:
    get: { summary: Own active sessions, responses: { '200': { description: OK } } }
  /auth/me/sessions/{id}:
    delete:
      summary: Revoke a session
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Revoked }, '404': { $ref: '#/components/responses/Error' } }
  /auth/me/tokens:
    get: { summary: Own API tokens, responses: { '200': { description: OK } } }
    post:
      summary: Create an API token (secret returned once)
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, expires_in_days: { type: integer, description: 0 = never } } } } } }
      responses: { '201': { description: Created } }
  /auth/me/tokens/{id}:
    delete:
      summary: Revoke an API token
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Revoked } }
  /roles:
    get: { summary: Roles and permissions (sys.users), responses: { '200': { description: OK } } }
  /users:
    get: { summary: List users (sys.users), responses: { '200': { description: OK } } }
    post:
      summary: Create user (sys.users)
      requestBody: { content: { application/json: { schema: { type: object, properties: { username: { type: string }, password: { type: string }, role: { type: string }, language: { type: string } } } } } }
      responses: { '201': { description: Created }, '400': { $ref: '#/components/responses/Error' } }
  /users/{id}:
    put:
      summary: Change role or disable (sys.users)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { role: { type: string }, disabled: { type: boolean } } } } } }
      responses: { '200': { description: Updated }, '409': { $ref: '#/components/responses/Error' } }
    delete:
      summary: Delete user (sys.users)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } }
  /users/{id}/password:
    put:
      summary: Set a user's password (sys.users)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { password: { type: string } } } } } }
      responses: { '204': { description: Set } }
  /users/{id}/mfa:
    delete:
      summary: Remove a user's second factor (sys.users)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: Removed } }
  /node:
    get: { summary: Host information and versions (sys.view), responses: { '200': { description: OK } } }
  /node/interfaces:
    get: { summary: Host network interfaces (network.view), responses: { '200': { description: OK } } }
  /networks:
    get: { summary: libvirt virtual networks (network.view), responses: { '200': { description: OK } } }
  /storage:
    get:
      summary: Storage pools (storage.view)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StoragePool' } } } } } }
  /storage/{pool}/volumes:
    get:
      summary: Volumes in a pool (storage.view)
      parameters: [{ $ref: '#/components/parameters/pool' }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StorageVolume' } } } } } }
  /storage/{pool}/volumes/{vol}:
    delete:
      summary: Delete a volume not used by any VM (storage.delete)
      parameters: [{ $ref: '#/components/parameters/pool' }, { name: vol, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } }
  /storage/{pool}/upload/{name}:
    put:
      summary: Upload a file into a directory pool (storage.upload); raw body, Content-Length required
      parameters: [{ $ref: '#/components/parameters/pool' }, { name: name, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses: { '201': { description: Uploaded }, '409': { $ref: '#/components/responses/Error' }, '413': { $ref: '#/components/responses/Error' } }
  /storage/{pool}/download:
    post:
      summary: Download a URL into a directory pool (storage.upload). Only public addresses unless allow_private_downloads is set.
      parameters: [{ $ref: '#/components/parameters/pool' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string }, name: { type: string, description: 'default: last URL path segment' }, checksum: { type: string, description: 'sha256:<hex> or sha512:<hex>' } } } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/Error' } }
  /vms:
    get:
      summary: List VMs with latest statistics (vm.view)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VM' } } } } } }
    post:
      summary: Create a VM (vm.create)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VMCreate' } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/Error' } }
  /vms/{name}:
    get:
      summary: VM details (vm.view)
      parameters: [{ $ref: '#/components/parameters/name' }]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VMDetail' } } } }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      summary: Delete a shut-off VM (vm.delete)
      parameters:
        - $ref: '#/components/parameters/name'
        - { name: confirm, in: query, required: true, description: must equal the VM name, schema: { type: string } }
        - { name: delete_disks, in: query, schema: { type: boolean } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '409': { $ref: '#/components/responses/Error' } }
  /vms/{name}/actions/{action}:
    post:
      summary: Power action (vm.power)
      parameters:
        - $ref: '#/components/parameters/name'
        - { name: action, in: path, required: true, schema: { type: string, enum: [start, shutdown, stop, reboot, reset, pause, resume] } }
      responses: { '204': { description: Done }, '409': { $ref: '#/components/responses/Error' } }
  /vms/{name}/meta:
    put:
      summary: Description, notes, tags, autostart (vm.config)
      parameters: [{ $ref: '#/components/parameters/name' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { description: { type: string }, notes: { type: string }, tags: { type: array, items: { type: string } }, autostart: { type: boolean } } } } } }
      responses: { '204': { description: Saved } }
  /vms/{name}/resources:
    put:
      summary: Change vCPUs and memory; applies at next start (vm.config)
      parameters: [{ $ref: '#/components/parameters/name' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { vcpus: { type: integer }, memory_mib: { type: integer } } } } } }
      responses: { '200': { description: 'Saved; pending_restart tells whether a restart is needed' } }
  /vms/{name}/template:
    put:
      summary: Mark or unmark as template (vm.config)
      parameters: [{ $ref: '#/components/parameters/name' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { template: { type: boolean } } } } } }
      responses: { '204': { description: Saved } }
  /vms/{name}/stats:
    get:
      summary: Statistics history, newest last (vm.view)
      parameters: [{ $ref: '#/components/parameters/name' }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VMStats' } } } } } }
  /vms/{name}/guest:
    get:
      summary: Guest agent information; available=false when the agent does not answer (vm.view)
      parameters: [{ $ref: '#/components/parameters/name' }]
      responses: { '200': { description: OK } }
  /vms/{name}/console:
    get:
      summary: VNC console as WebSocket (subprotocol "binary") (vm.console)
      parameters: [{ $ref: '#/components/parameters/name' }]
      responses: { '101': { description: Switching protocols } }
  /vms/{name}/disks:
    post:
      summary: Add a disk; hot-plugged when running and possible (vm.config)
      parameters: [{ $ref: '#/components/parameters/name' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { pool: { type: string }, size_gib: { type: integer }, bus: { type: string, enum: [virtio, scsi, sata] } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeResult' } } } } }
  /vms/{name}/disks/{target}:
    delete:
      summary: Detach a disk (vm.config); delete_volume=true also deletes the data (vm.delete, confirm=<target>)
      parameters:
        - $ref: '#/components/parameters/name'
        - { name: target, in: path, required: true, schema: { type: string } }
        - { name: delete_volume, in: query, schema: { type: boolean } }
        - { name: confirm, in: query, schema: { type: string } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeResult' } } } } }
  /vms/{name}/disks/{target}/size:
    put:
      summary: Grow a disk (online when running) (vm.config)
      parameters: [{ $ref: '#/components/parameters/name' }, { name: target, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { size_gib: { type: integer } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeResult' } } } } }
  /vms/{name}/cdrom/{target}:
    put:
      summary: Insert (pool+volume) or eject (empty body) a medium (vm.config)
      parameters: [{ $ref: '#/components/parameters/name' }, { name: target, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { pool: { type: string }, volume: { type: string } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeResult' } } } } }
  /vms/{name}/nics:
    post:
      summary: Add a network interface (vm.config)
      parameters: [{ $ref: '#/components/parameters/name' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { network: { type: string, example: 'network:default' }, model: { type: string } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeResult' } } } } }
  /vms/{name}/nics/{mac}:
    delete:
      summary: Remove a network interface (vm.config)
      parameters: [{ $ref: '#/components/parameters/name' }, { name: mac, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeResult' } } } } }
  /vms/{name}/boot:
    put:
      summary: Boot order by disk target (vm.config); applies at next start
      parameters: [{ $ref: '#/components/parameters/name' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { order: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeResult' } } } } }
  /vms/{name}/snapshots:
    get:
      summary: Snapshots (vm.view)
      parameters: [{ $ref: '#/components/parameters/name' }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Snapshot' } } } } } }
    post:
      summary: Create a snapshot; includes memory when running (vm.snapshot). Not supported for running UEFI VMs or non-qcow2 disks.
      parameters: [{ $ref: '#/components/parameters/name' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, description: { type: string } } } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' } }
  /vms/{name}/snapshots/{snap}/revert:
    post:
      summary: Revert to a snapshot (vm.snapshot)
      parameters: [{ $ref: '#/components/parameters/name' }, { name: snap, in: path, required: true, schema: { type: string } }]
      responses: { '202': { $ref: '#/components/responses/Accepted' } }
  /vms/{name}/snapshots/{snap}:
    delete:
      summary: Delete a snapshot (vm.snapshot)
      parameters: [{ $ref: '#/components/parameters/name' }, { name: snap, in: path, required: true, schema: { type: string } }]
      responses: { '202': { $ref: '#/components/responses/Accepted' } }
  /vms/{name}/clone:
    post:
      summary: Full clone, or linked clone of a template (vm.create)
      parameters: [{ $ref: '#/components/parameters/name' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, mode: { type: string, enum: [full, linked] }, pool: { type: string }, start: { type: boolean } } } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' } }
  /vms/{name}/cloudinit:
    put:
      summary: Replace the cloud-init configuration; applies at next boot (vm.config)
      parameters: [{ $ref: '#/components/parameters/name' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CloudInit' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeResult' } } } } }
  /vms/{name}/backup:
    post:
      summary: Back up a VM (backup.create). Running VMs use a point-in-time backup job (guest file systems frozen when the guest agent answers); shut-off VMs are copied.
      parameters: [{ $ref: '#/components/parameters/name' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [store], properties: { store: { type: string }, notes: { type: string } } } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/Error' } }
  /containers:
    get:
      summary: List containers (ct.view)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Container' } } } } } }
    post:
      summary: Create an unprivileged container (ct.create)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ContainerCreate' } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/Error' } }
  /containers/{name}:
    get:
      summary: Container details (ct.view)
      parameters: [{ $ref: '#/components/parameters/ctname' }]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Container' } } } } }
    delete:
      summary: Delete a stopped container (ct.delete)
      parameters:
        - $ref: '#/components/parameters/ctname'
        - { name: confirm, in: query, required: true, schema: { type: string } }
      responses: { '202': { $ref: '#/components/responses/Accepted' } }
  /containers/{name}/actions/{action}:
    post:
      summary: Lifecycle action (ct.power)
      parameters:
        - $ref: '#/components/parameters/ctname'
        - { name: action, in: path, required: true, schema: { type: string, enum: [start, shutdown, stop, reboot, freeze, unfreeze] } }
      responses: { '204': { description: Done }, '409': { $ref: '#/components/responses/Error' } }
  /containers/{name}/config:
    put:
      summary: Limits, autostart, description; applies at next start (ct.config)
      parameters: [{ $ref: '#/components/parameters/ctname' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { memory_mib: { type: integer }, swap_mib: { type: integer }, cpu_limit: { type: number }, autostart: { type: boolean }, description: { type: string } } } } } }
      responses: { '204': { description: Saved } }
  /containers/{name}/console:
    get:
      summary: 'Terminal WebSocket: binary messages = input/output, text {"type":"resize","cols","rows"} (ct.console)'
      parameters: [{ $ref: '#/components/parameters/ctname' }]
      responses: { '101': { description: Switching protocols } }
  /containers/{name}/backup:
    post:
      summary: Back up a container (backup.create)
      parameters: [{ $ref: '#/components/parameters/ctname' }]
      requestBody: { content: { application/json: { schema: { type: object, required: [store], properties: { store: { type: string }, notes: { type: string }, mode: { type: string, enum: [stop, suspend, live], default: stop } } } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' } }
  /backup-stores:
    get:
      summary: Storage pools usable as backup stores (backup.view)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StoragePool' } } } } } }
  /backups:
    get:
      summary: Backups of one store or all active stores (backup.view)
      parameters:
        - { name: store, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [vm, ct] } }
        - { name: name, in: query, schema: { type: string } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Backup' } } } } } }
    delete:
      summary: Delete a backup that is not protected (backup.delete)
      parameters:
        - { name: store, in: query, required: true, schema: { type: string } }
        - { name: id, in: query, required: true, schema: { type: string } }
      responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } }
  /backups/restore:
    post:
      summary: Restore a backup as a new VM or container (backup.restore). Keeps UUID/MAC when restored under the original name and the original no longer exists.
      requestBody: { content: { application/json: { schema: { type: object, required: [store, id], properties: { store: { type: string }, id: { type: string }, name: { type: string }, pool: { type: string, description: VMs only (required) }, start: { type: boolean } } } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/Error' } }
  /backups/protected:
    put:
      summary: Protect or unprotect a backup (backup.delete)
      requestBody: { content: { application/json: { schema: { type: object, properties: { store: { type: string }, id: { type: string }, protected: { type: boolean } } } } } }
      responses: { '204': { description: Saved } }
  /backups/prune:
    post:
      summary: Apply a retention policy to one guest's backups (backup.delete)
      requestBody: { content: { application/json: { schema: { type: object, properties: { store: { type: string }, kind: { type: string, enum: [vm, ct] }, name: { type: string }, keep: { $ref: '#/components/schemas/Keep' }, dry_run: { type: boolean } } } } } }
      responses: { '200': { description: '{kept, removed} backup ids' } }
  /backup-schedules:
    get:
      summary: Backup schedules (backup.view)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BackupSchedule' } } } } } }
    post:
      summary: Create a schedule (backup.schedule)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/BackupSchedule' } } } }
      responses: { '201': { description: Created }, '400': { $ref: '#/components/responses/Error' } }
  /backup-schedules/{id}:
    put:
      summary: Update a schedule (backup.schedule)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/BackupSchedule' } } } }
      responses: { '200': { description: Updated } }
    delete:
      summary: Delete a schedule; backups are kept (backup.schedule)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: Deleted } }
  /backup-schedules/{id}/run:
    post:
      summary: Run a schedule now (backup.schedule)
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '409': { $ref: '#/components/responses/Error' } }
  /lxc/images:
    get:
      summary: Images available on images.linuxcontainers.org (ct.create)
      parameters: [{ name: arch, in: query, schema: { type: string, enum: [amd64, arm64, i386] } }]
      responses: { '200': { description: OK } }
  /jobs:
    get:
      summary: List jobs (jobs.view)
      parameters:
        - { name: target, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { '200': { description: '{items, total}' } }
  /jobs/{id}:
    get:
      summary: Job status (jobs.view)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } } }
  /jobs/{id}/log:
    get:
      summary: Job log lines after the given line id (jobs.view)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /jobs/{id}/cancel:
    post:
      summary: Request cancellation (initiator or admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '202': { description: Requested }, '409': { $ref: '#/components/responses/Error' } }
  /audit:
    get:
      summary: Audit log (sys.audit)
      parameters:
        - { name: user, in: query, schema: { type: string } }
        - { name: action, in: query, description: prefix match, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { '200': { description: '{items, total}' } }
  /audit/verify:
    get:
      summary: Verify the audit hash chain (sys.audit)
      responses: { '200': { description: '{checked, intact, broken_at}' } }
